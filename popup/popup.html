<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تنظیمات ورود خودکار سس</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-title">
        <svg class="icon header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
        </svg>
        <h1>سامانه سس دانشگاه شیراز</h1>
      </div>
      <span class="badge">ورود خودکار</span>
    </header>

    <form id="settingsForm">
      <div class="form-group">
        <label for="username">شناسه کاربری / شماره دانشجویی</label>
        <div class="input-wrapper">
          <input type="text" id="username" name="username" placeholder="مثال: 9812345" autocomplete="username" dir="ltr" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">کلمه عبور</label>
        <div class="input-wrapper">
          <input type="password" id="password" name="password" placeholder="کلمه عبور سس" autocomplete="current-password" dir="ltr" required>
          <button type="button" id="togglePassword" class="icon-btn" title="نمایش/مخفی‌سازی رمز">
            <svg id="eyeIcon" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div class="toggle-group">
        <label class="switch-label" for="autoLogin">
          <span class="label-text">ورود خودکار فعال باشد</span>
          <span class="label-sub">هنگام لود صفحه لاگین، خودکار وارد شود</span>
        </label>
        <label class="switch">
          <input type="checkbox" id="autoLogin">
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-group">
        <label class="switch-label" for="autoResetCaptcha">
          <span class="label-text">ریست هوشمند کپچا</span>
          <span class="label-sub">پاکسازی سشن و کوکی‌ها در صورت وجود کپچا</span>
        </label>
        <label class="switch">
          <input type="checkbox" id="autoResetCaptcha">
          <span class="slider"></span>
        </label>
      </div>

      <div class="button-group">
        <button type="submit" id="btnSave" class="btn btn-primary">
          <svg class="icon btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          ذخیره اطلاعات
        </button>

        <button type="button" id="btnOpenSess" class="btn btn-secondary">
          <svg class="icon btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          باز کردن سامانه سس
        </button>

        <button type="button" id="btnClearCookies" class="btn btn-outline" title="پاک کردن کوکی‌ها و سشن ذخیره شده در مرورگر">
          <svg class="icon btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
          پاکسازی دستی سشن و کوکی‌ها
        </button>
      </div>
    </form>

    <div id="statusAlert" class="status-alert hidden"></div>

    <footer class="footer">
      <div class="security-note">
        <svg class="icon info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>اطلاعات شما فقط در مرورگر خودتان ذخیره می‌شود.</span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
